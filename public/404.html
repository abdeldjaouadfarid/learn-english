<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#4f9eff" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <title>Page not found</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app" class="narrow" style="text-align:center; padding-top:60px;">
    <div id="notFoundIcon" style="display:inline-flex; width:88px; height:88px; align-items:center; justify-content:center; border-radius:20px; background:rgba(79,158,255,0.12); color:var(--accent); margin-bottom:16px;"></div>
    <h1>Page not found</h1>
    <p class="lead">The URL you followed doesn't exist here.</p>
    <div class="card">
      <a href="/" class="link-btn" style="font-size:15px;">← Go to the dashboard</a>
    </div>
  </div>
  <script src="/icons.js"></script>
  <script>
    const el = document.getElementById('notFoundIcon');
    el.innerHTML = Icons.svg('compass', 'icon');
    el.querySelector('.icon').style.width = '44px';
    el.querySelector('.icon').style.height = '44px';
  </script>
</body>
</html>
